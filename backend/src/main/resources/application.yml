server:
  port: 8082
  address: 0.0.0.0

spring:
  application:
    name: sumi-api
  datasource:
    url: jdbc:h2:file:/workspace/backend/data/sumi;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

sumi:
  stack: Spring Boot 4.1.1
